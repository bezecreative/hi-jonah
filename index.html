<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Mox × ESI</title>
  <link rel="icon" href="https://framerusercontent.com/images/D3waG8QQQcHEuMm1a268yWiQ.png" media="(prefers-color-scheme: light)">
  <link rel="icon" href="https://framerusercontent.com/images/Fx4nZyS4cAOBcVK4qgdvKx2fKo.png" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="https://framerusercontent.com/images/D3waG8QQQcHEuMm1a268yWiQ.png">
  <link rel="preconnect" href="https://framerusercontent.com" crossorigin>
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="https://framerusercontent.com/assets/mxKkbXd3Ku1mfoibJQmr32elZmA.woff2">
  <style>
    @font-face {
      font-family: "Indivisible Bold Placeholder";
      src: local("Arial");
      ascent-override: 82.16%;
      descent-override: 27.39%;
      line-gap-override: 0%;
      size-adjust: 109.54%;
    }
    @font-face {
      font-family: "Indivisible Bold";
      src: url("https://framerusercontent.com/assets/mxKkbXd3Ku1mfoibJQmr32elZmA.woff2") format("woff2");
      font-display: swap;
      font-style: normal;
      font-weight: 700;
    }

    :root {
      --red: #e1251b;
      --red-pressed: #b81c14;
      --font: "Indivisible Bold", "Indivisible Bold Placeholder", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { background: #0b0b0b; }

    html, body {
      margin: 0;
      min-height: 100%;
      color: #fff;
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
    }

    /* First screen: header + message fill exactly one viewport so the
       arrow can sit at the 90% mark on first load. svh = the viewport
       with mobile browser bars showing, which is the first-load state. */
    .hero {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
    }

    /* Fixed full-screen background. A pseudo-element is used because
       background-attachment: fixed is unreliable on iOS Safari. */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background: #0b0b0b url("https://framerusercontent.com/images/D6LUktxLOs30j8QU5pGXyK7lwKA.png") 82% 100% / cover no-repeat;
    }

    header {
      background: #000;
      padding: calc(14px + env(safe-area-inset-top)) 20px 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 3.15vw, 22px);
    }

    header img {
      display: block;
      width: auto;
      height: clamp(24px, 7.35vw, 45px);
    }

    /* The ESI artwork is taller than the Mox wordmark, so it gets a
       little more height to feel optically balanced. */
    header img.esi { height: clamp(28px, 8.75vw, 53px); }

    .x {
      flex: none;
      width: clamp(13px, 3.85vw, 22px);
      height: clamp(13px, 3.85vw, 22px);
      color: var(--red);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      text-align: center;
      gap: clamp(36px, 9vh, 84px);
      gap: clamp(36px, 9svh, 84px);
      padding: 32px 24px 21vh;
      padding: 32px 24px 21svh;
    }

    h1 {
      margin: 0;
      max-width: 16ch;
      font-size: clamp(1.875rem, 8vw, 4rem);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: 0;
      text-transform: uppercase;
      text-wrap: balance;
    }

    h1 .sub { font-size: 0.8em; }

    .access {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .lead {
      margin: 0;
      font-size: clamp(1.0625rem, 4.6vw, 1.5rem);
      font-weight: 700;
      line-height: 1.3;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      max-width: 360px;
      min-height: 60px;
      padding: 16px 28px;
      border-radius: 999px;
      background: var(--red);
      color: #fff;
      font-family: var(--font);
      font-size: clamp(1.125rem, 4.8vw, 1.375rem);
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 10px 30px rgba(225, 37, 27, 0.35);
      transition: background-color 0.15s ease, transform 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .cta:hover { background: #f0342a; }
    .cta:active { background: var(--red-pressed); transform: scale(0.98); }
    .cta:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

    .cta svg { width: 1.15em; height: 1.15em; flex: none; }

    .arrow {
      position: absolute;
      left: 50%;
      top: 90vh;
      top: 90svh;
      width: 48px;
      height: 48px;
      margin: -24px 0 0 -24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      animation: bob 1.8s ease-in-out infinite;
      -webkit-tap-highlight-color: transparent;
    }
    .arrow svg { width: 30px; height: 30px; }
    .arrow:focus-visible { outline: 3px solid #fff; outline-offset: 2px; border-radius: 50%; }

    @keyframes bob {
      0%, 100% { transform: translateY(-4px); }
      50%      { transform: translateY(4px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .arrow { animation: none; }
      html { scroll-behavior: auto !important; }
    }

    html { scroll-behavior: smooth; }

    .clients {
      padding: 56px 24px calc(72px + env(safe-area-inset-bottom));
      text-align: center;
    }

    .clients .ps {
      margin: 0 auto 10px;
      max-width: 22ch;
      text-wrap: balance;
      font-size: clamp(1.0625rem, 4.6vw, 1.5rem);
      font-weight: 700;
      line-height: 1.3;
    }

    .clients h2 {
      margin: 0 0 clamp(32px, 8vw, 56px);
      font-size: clamp(1.625rem, 7vw, 3rem);
      font-weight: 700;
      line-height: 1.1;
      text-transform: uppercase;
      text-wrap: balance;
    }

    .logos {
      list-style: none;
      margin: 0 auto;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(33px, 9vw, 48px);
    }

    .logos li { display: flex; justify-content: center; }

    .logos img {
      display: block;
      width: auto;
      height: auto;
      max-width: min(139px, 38.7vw);
      max-height: 69px;
      object-fit: contain;
    }

    /* Square and tall marks need more height than wide wordmarks to
       carry the same visual weight. */
    .logos img.tall { max-height: 95px; }

    /* The TMN SVG is only 56px wide natively, so it needs an explicit width. */
    .logos img.tmn { width: min(107px, 30.6vw); max-height: none; }
  </style>
</head>
<body>
  <div class="hero">
  <header>
    <img class="mox" alt="Mox Collective"
         src="https://framerusercontent.com/images/qEUvrwGl1OdKN8lUghRyZnsFfj0.png?scale-down-to=2048&width=12752&height=3596"
         width="2048" height="578">
    <svg class="x" viewBox="0 0 24 24" role="img" aria-label="and">
      <path d="M4 4l16 16M20 4L4 20" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="square"/>
    </svg>
    <img class="esi" alt="ESI Construction"
         src="https://esiconstruction.com/wp-content/themes/esi/img/ESI-New-logo.png"
         width="1853" height="708">
  </header>

  <main>
    <h1>Oh hi there,<br><span class="sub">we thought you&rsquo;d appreciate the challenge.</span></h1>

    <div class="access">
      <p class="lead">Next step:</p>

    <a class="cta" href="tel:+12086088300">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.6a1 1 0 0 1-.25 1L6.6 10.8z"/>
      </svg>
      Call Jonah
    </a>
    </div>
  </main>

  <a class="arrow" href="#clients" aria-label="Scroll to our clients">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 3v17M5 13l7 7 7-7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </a>
  </div>

  <section class="clients" id="clients">
    <p class="ps">P.S. Here&rsquo;s a few of our favorite Idaho clients</p>
    <h2>Globally trusted, Idaho built</h2>
    <ul class="logos">
      <li><img class="tall" alt="7-Eleven" loading="lazy" width="512" height="512"
               src="https://framerusercontent.com/images/lhzD1M2uEkxnux9z5KIO4i7tQaE.png?scale-down-to=512&width=941&height=941"></li>
      <li><img alt="College of Western Idaho" loading="lazy" width="512" height="113"
               src="https://framerusercontent.com/images/VONp9QD8aYl3INUFx6Qk12zDs.png?scale-down-to=512&width=1465&height=323"></li>
      <li><img alt="Athletic Club Boise" loading="lazy" width="512" height="278"
               src="https://framerusercontent.com/images/rTu9W0JEd8wjKfNw2Y4QfmpRP0.png?scale-down-to=512&width=1476&height=800"></li>
      <li><img class="tall" alt="Boise Schools" loading="lazy" width="812" height="1024"
               src="https://framerusercontent.com/images/u9OLX8kPBxuHvwYEX0Upx2VrgI.png?scale-down-to=1024&width=825&height=1041"></li>
      <li><img alt="Sockeye Brewing" loading="lazy" width="334" height="140"
               src="https://sockeyebrew.com/wp-content/uploads/2026/05/Sockeye-Brewing_Logo-Primary_Black_Light-1.png"></li>
      <li><img class="tmn" alt="TMN" loading="lazy" width="56" height="32"
               src="https://res.cloudinary.com/dbwtszgtb/image/upload/White_TMN.svg"></li>
    </ul>
  </section>
</body>
</html>
